<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reader Hero codec probe</title>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 1rem; background: #f5f5f4; }
  button { font-size: 1rem; padding: 0.5rem 1rem; margin: 0.25rem 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #fff; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; }
  img { image-rendering: pixelated; border: 1px solid #999; margin: 0.5rem 0; }
</style>
</head>
<body>
<h3>Reader Hero codec probe</h3>
<p>Pick the PDF and tap Probe. Results are beaconed to the dev machine and shown below.</p>
<input type="file" accept="application/pdf" id="file" />
<button id="probe" disabled>Probe</button>
<pre id="out"></pre>
<img id="thumb" hidden alt="" />

<script>
"use strict";

function beaconUrl() {
  const from = new URLSearchParams(location.search).get("log");
  return from || "/__log";
}

function send(name, detail) {
  document.getElementById("out").textContent += `${name}: ${detail ?? ""}\n`;
  fetch(beaconUrl(), {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ at: Date.now(), name, detail, ms: 0 }),
  }).catch(() => {});
}

/* Extract JPEG plate bytes: find each /DCTDecode image dict, take the rough
   bytes between its `stream` line and the matching `endstream`, then trim to
   the SOI/EOI markers so boundary offsets cannot corrupt the slices. */
function extractJpegs(bytes) {
  const text = new TextDecoder("latin1").decode(bytes);
  const findMarker = (from, limit, second) => {
    for (let at = from; at + 1 < limit; at += 1) {
      if (bytes[at] === 0xff && bytes[at + 1] === second) return at;
    }
    return -1;
  };
  const plates = [];
  let from = 0;
  for (;;) {
    const marker = text.indexOf("DCTDecode", from);
    if (marker < 0) break;
    from = marker + 9;

    const dataAt = text.indexOf("stream", marker);
    if (dataAt < 0) continue;
    const endAt = text.indexOf("endstream", dataAt);
    if (endAt < 0) continue;

    // SOI somewhere after the stream keyword, EOI somewhere before endstream.
    const soi = findMarker(dataAt, endAt, 0xd8);
    if (soi < 0) continue;
    const limit = Math.min(endAt, bytes.length - 1);
    let eoi = -1;
    for (let at = soi + 2; at + 1 < limit; at += 1) {
      if (bytes[at] === 0xff && bytes[at + 1] === 0xd9) eoi = at;
    }
    if (eoi < 0) continue;

    const slice = bytes.slice(soi, eoi + 2);
    if (slice.length < 11) continue;
    plates.push(slice);
  }
  return plates;
}

function jpegShape(bytes) {
  const shape = {
    width: 0, height: 0, components: 0, precision: 0,
    progressive: false, adobe: null, exif: 0, offset: 0,
  };
  let soi = 0;
  while (soi + 3 < bytes.length && !(bytes[soi] === 0xff && bytes[soi + 1] === 0xd8)) soi += 1;
  if (soi >= bytes.length) return shape;
  shape.offset = soi;

  const jpeg = bytes.subarray(soi);
  const view = new DataView(jpeg.buffer, jpeg.byteOffset, jpeg.byteLength);
  let at = 2;
  for (;;) {
    if (at + 4 > jpeg.length || jpeg[at] !== 0xff) break;
    const marker = view.getUint16(at);
    if (marker === 0xffd9) break; // EOI
    const length = view.getUint16(at + 2);
    if (marker === 0xffc0 || marker === 0xffc1 || marker === 0xffc2) {
      shape.progressive = marker === 0xffc2;
      shape.precision = jpeg[at + 4];
      shape.height = view.getUint16(at + 5);
      shape.width = view.getUint16(at + 7);
      shape.components = jpeg[at + 9];
    }
    if (marker === 0xffee && length >= 14) {
      // APP14 payload: "Adobe" (5) + version (2) + flags0 (2) + flags1 (2) + transform (1).
      const magic =
        jpeg[at + 4] === 0x41 && jpeg[at + 5] === 0x64 && jpeg[at + 6] === 0x6f &&
        jpeg[at + 7] === 0x62 && jpeg[at + 8] === 0x65;
      shape.adobe = magic ? jpeg[at + 16] : null;
    }
    if (marker === 0xffe1) shape.exif += 1;
    at += 2 + length;
  }
  return shape;
}

async function mainThreadDecode(bytes) {
  const blob = new Blob([bytes], { type: "image/jpeg" });
  const started = performance.now();
  const bitmap = await createImageBitmap(blob);
  const ms = performance.now() - started;
  await thumbnail(bitmap, "main");
  bitmap.close();
  return `main-thread createImageBitmap ok in ${ms.toFixed(0)}ms`;
}

async function thumbnail(source, label) {
  const canvas = document.createElement("canvas");
  const side = Math.min(96, source.width, source.height);
  canvas.width = side;
  canvas.height = side;
  canvas.getContext("2d").drawImage(source, 0, 0, side, side);
  const img = document.getElementById("thumb");
  img.hidden = false;
  img.src = canvas.toDataURL("image/jpeg", 0.5);
  send("probe.thumb." + label, img.src.split(",").length + " chars shown on page");
}

/* Same probe as pdf.js's worker, run in a fresh worker context. */
const workerSource = `
self.onmessage = async (event) => {
  const bytes = new Uint8Array(event.data);
  const result = {
    imageDecoderSupported: typeof ImageDecoder === "function",
    decoderMs: null, decoderError: null, width: 0, height: 0,
  };
  try {
    const started = performance.now();
    const decoder = new ImageDecoder({ data: bytes, type: "image/jpeg", preferAnimation: false });
    const frame = await decoder.decode();
    result.decoderMs = performance.now() - started;
    result.width = frame.image.displayWidth || frame.image.width;
    result.height = frame.image.displayHeight || frame.image.height;
    const page = new OffscreenCanvas(64, 64);
    page.getContext("2d").drawImage(frame.image, 0, 0, 64, 64);
    frame.image.close();
    result.corner = Array.from(page.getContext("2d").getImageData(0, 0, 4, 1).data);
  } catch (error) {
    result.decoderError = String(error);
  }
  self.postMessage(result);
};
`;

const file = document.getElementById("file");
const button = document.getElementById("probe");
file.addEventListener("change", () => { button.disabled = file.files.length === 0; });
button.addEventListener("click", async () => {
  const selected = file.files[0];
  if (!selected) return;
  button.disabled = true;
  try {
    send("probe.file", `${(selected.size / 1e6).toFixed(1)}MB`);
    const bytes = new Uint8Array(await selected.arrayBuffer());

    const plates = extractJpegs(bytes);
    send("probe.plates", String(plates.length));
    for (const [index, plate] of plates.entries()) {
      const shape = jpegShape(plate);
      send(
        "probe.shape." + index,
        `${(plate.length / 1024).toFixed(0)}KB ${shape.width}x${shape.height} ` +
        `comps=${shape.components} bpp=${shape.precision} prog=${shape.progressive ? 1 : 0} ` +
        `adobe=${shape.adobe === null ? "?" : shape.adobe} exif=${shape.exif} so@${shape.offset}`,
      );
    }
    if (plates.length === 0) {
      send("probe.done", "no plates found");
      return;
    }

    try {
      send("probe.main", await mainThreadDecode(plates[0]));
    } catch (error) {
      send("probe.main", "failed: " + String(error));
    }

    const blob = new Blob([workerSource], { type: "text/javascript" });
    const worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = (event) => {
      send("probe.worker", JSON.stringify(event.data));
      send("probe.done", "complete");
    };
    worker.onerror = (error) => {
      send("probe.done", "worker error: " + error.message);
    };
    worker.postMessage(plates[0].buffer, [plates[0].buffer]);
  } catch (error) {
    send("probe.done", "failed: " + String(error));
  }
  button.disabled = false;
});
</script>
</body>
</html>
