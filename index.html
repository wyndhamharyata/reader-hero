<!doctype html>
<html lang="en" data-theme="rhlight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151411" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reader Hero" />
    <meta name="description" content="Offline PDF reader with a reflowed reader mode." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Reader Hero</title>
    <script>
      // The saved theme, before the first paint: Safari's own chrome takes the colour it finds at launch.
      try {
        var saved = localStorage.getItem("rh-theme");
        var colour = saved === "rhdim" ? "#201f1c" : saved === "rhdark" ? "#151411" : null;

        if (colour !== null) {
          document.documentElement.dataset.theme = saved;

          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute("content", colour);
          });
        }
      } catch (error) {
        // Without storage the launch opens in the light theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
